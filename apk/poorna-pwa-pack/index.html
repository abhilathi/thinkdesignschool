<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Poorna — Your Complete Financial Plan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12312B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script id="jspdf-script" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F3F6F1;
    --ink:#12312B;
    --surface:#FFFFFF;
    --primary:#1F6F5C;
    --primary-dark:#12312B;
    --accent:#C99A3E;
    --danger:#A6432F;
    --amber:#B8862F;
    --good:#2C7A55;
    --muted:#6B7A73;
    --border:#DDE4DA;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#E9EFE5,#F3F6F1 40%);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    padding:24px 10px;
  }
  .phone{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border-radius:28px;
    box-shadow:0 30px 60px -20px rgba(18,49,43,0.35), 0 0 0 8px #0E241F;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:760px;
    position:relative;
  }
  .statusbar{
    height:14px;background:#0E241F;
  }
  header.appbar{
    background:var(--primary-dark);
    color:#F3F6F1;
    padding:18px 20px 16px;
    position:relative;
  }
  header.appbar .brand{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:0.2px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  header.appbar .brand small{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
    color:#B9C9C0;
  }
  .progress-track{
    margin-top:14px;
    display:flex;
    gap:4px;
  }
  .progress-seg{
    flex:1;
    height:4px;
    border-radius:3px;
    background:rgba(255,255,255,0.18);
    overflow:hidden;
  }
  .progress-seg.done{background:var(--accent);}
  .progress-seg.current{background:linear-gradient(90deg,var(--accent),rgba(201,154,62,0.35));}
  .step-label{
    font-size:11px;
    color:#B9C9C0;
    margin-top:8px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  main{
    flex:1;
    padding:24px 22px 14px;
    overflow-y:auto;
  }
  h1.q{
    font-family:'Fraunces',serif;
    font-size:23px;
    line-height:1.28;
    font-weight:600;
    margin:0 0 6px;
    color:var(--primary-dark);
  }
  p.hint{
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 20px;
    line-height:1.5;
  }
  label.field-label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--primary-dark);
    margin:16px 0 6px;
  }
  input[type=text],input[type=number],select{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:11px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#FCFDFB;
    outline:none;
  }
  input:focus,select:focus{border-color:var(--primary);background:#fff;}
  .rupee-wrap{position:relative;}
  .rupee-wrap input{padding-left:26px;}
  .rupee-wrap:before{
    content:"₹";
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:15px;
  }
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .choice-grid{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .choice{
    border:1.5px solid var(--border);
    border-radius:13px;
    padding:13px 14px;
    cursor:pointer;
    background:#FCFDFB;
    transition:border-color .15s, background .15s;
  }
  .choice.selected{border-color:var(--primary);background:#EEF5F0;}
  .choice .t{font-weight:600;font-size:14.5px;color:var(--primary-dark);}
  .choice .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4;}

  .card-list{margin-top:8px;display:flex;flex-direction:column;gap:10px;}
  .item-card{
    border:1.5px solid var(--border);
    border-radius:13px;
    padding:12px 14px;
    background:#FCFDFB;
    position:relative;
  }
  .item-card .rm{
    position:absolute;top:10px;right:10px;
    background:none;border:none;color:var(--danger);
    font-size:12px;font-weight:600;cursor:pointer;
  }
  .add-btn{
    margin-top:10px;
    width:100%;
    padding:11px;
    border:1.5px dashed var(--primary);
    border-radius:11px;
    background:transparent;
    color:var(--primary);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }

  footer.nav{
    padding:14px 22px 20px;
    display:flex;
    gap:10px;
    border-top:1px solid var(--border);
    background:#fff;
  }
  button.btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    cursor:pointer;
  }
  button.btn.primary{background:var(--primary-dark);color:#fff;}
  button.btn.primary:active{background:#0c211d;}
  button.btn.ghost{background:#EEF2EC;color:var(--primary-dark);flex:0 0 84px;}

  /* review / report styling */
  .summary-card{
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    background:#EEF5F0;
    border:1px solid #D7E6DA;
  }
  .summary-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  .summary-card .value{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--primary-dark);margin-top:4px;}
  .summary-card .sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini{border-radius:12px;padding:12px;background:#fff;border:1px solid var(--border);}
  .mini .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .mini .value{font-family:'Fraunces',serif;font-size:17px;color:var(--primary-dark);margin-top:3px;}
  .zone{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;margin-top:6px;}
  .zone.green{background:#E1F1E6;color:var(--good);}
  .zone.yellow{background:#FBF0DA;color:var(--amber);}
  .zone.red{background:#F7E6E2;color:var(--danger);}
  .goal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .goal-row:last-child{border-bottom:none;}
  .goal-row .n{font-weight:600;color:var(--primary-dark);}
  .goal-row .c{color:var(--muted);font-size:11.5px;}
  h2.section-title{
    font-family:'Fraunces',serif;font-size:16px;color:var(--primary-dark);
    margin:22px 0 8px;
  }
  .welcome-icon{
    width:56px;height:56px;border-radius:16px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"></div>
  <header class="appbar">
    <div class="brand">Poorna <small>· financial planning</small></div>
    <div class="progress-track" id="progressTrack"></div>
    <div class="step-label" id="stepLabel"></div>
  </header>
  <main id="main"></main>
  <footer class="nav" id="navBar"></footer>
</div>

<script>
/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
const state = {
  personal:{ name:"", age:35, retireAge:60, occupation:"", marital:"Married", country:"India" },
  family:[],
  income:{ salary:0, other:0 },
  expenses:{ household:0, transport:0, discretionary:0, healthcare:0, education:0, other:0 },
  loans:[],
  premiums:{ lifePremium:0, healthPremium:0 },
  investments:[],
  physicalAssets:{ home:0, gold:0, other:0 },
  existingSIP:0,
  insurance:{ lifeCover:0, healthCover:0 },
  risk:"moderate",
  goals:[],
  retirement:{ expenseToday:0, otherIncome:0, lifeExpectancy:85 }
};

const RISK_PROFILES = {
  conservative:{ label:"Conservative", desc:"I prefer safety of capital over growth; small ups and downs worry me.", equity:20, debt:80 },
  moderate:{ label:"Moderate", desc:"I can accept modest swings for better long-term growth.", equity:40, debt:60 },
  moderatelyAggressive:{ label:"Moderately Aggressive", desc:"I can stay invested through market swings for higher growth.", equity:60, debt:40 },
  aggressive:{ label:"Aggressive", desc:"I'm comfortable with large swings in pursuit of maximum growth.", equity:80, debt:20 }
};

const EQUITY_RATE = 0.09, DEBT_RATE = 0.06;
const INCOME_GROWTH = 0.06;

const COUNTRY_INFLATION = {
  "India":                { general:0.055, education:0.08,  auto:0.06,  construction:0.06,  wedding:0.055 },
  "United States":        { general:0.03,  education:0.05,  auto:0.03,  construction:0.04,  wedding:0.03  },
  "United Kingdom":       { general:0.03,  education:0.04,  auto:0.03,  construction:0.04,  wedding:0.03  },
  "United Arab Emirates": { general:0.025, education:0.04,  auto:0.02,  construction:0.03,  wedding:0.025 },
  "Australia":            { general:0.035, education:0.05,  auto:0.03,  construction:0.04,  wedding:0.035 },
  "Canada":                { general:0.03,  education:0.045, auto:0.03,  construction:0.04,  wedding:0.03  },
  "Singapore":            { general:0.03,  education:0.04,  auto:0.03,  construction:0.035, wedding:0.03  },
  "Other":                { general:0.04,  education:0.06,  auto:0.04,  construction:0.05,  wedding:0.04  }
};
function countryRates(){ return COUNTRY_INFLATION[state.personal.country] || COUNTRY_INFLATION["India"]; }
const GOAL_CATEGORY_LABELS = { general:"General", education:"Education", auto:"Automobile", construction:"Construction/Renovation", wedding:"Wedding" };
function detectGoalCategory(name){
  const n = (name||'').toLowerCase();
  if(/educat|school|college|tuition|study|degree|university/.test(n)) return 'education';
  if(/wedding|marriage/.test(n)) return 'wedding';
  if(/\bcar\b|vehicle|bike|automobile|scooter/.test(n)) return 'auto';
  if(/renovat|construct|\bhome\b|apartment|\bhouse\b/.test(n)) return 'construction';
  return 'general';
}
function goalInflationRate(name){
  const cat = detectGoalCategory(name);
  return countryRates()[cat] ?? countryRates().general;
}
function goalBadgeText(name){
  const cat = detectGoalCategory(name);
  const rate = goalInflationRate(name);
  return `${GOAL_CATEGORY_LABELS[cat]} inflation (${(rate*100).toFixed(1)}%)`;
}
function currentMonthlyExpenseTotal(){
  return Object.values(state.expenses).reduce((a,b)=>a+b,0);
}

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function inr(n){
  n = Math.round(n||0);
  const neg = n<0; n=Math.abs(n);
  return (neg?"-₹":"₹")+n.toLocaleString('en-IN');
}
function fv(pv,rate,years){ return pv*Math.pow(1+rate,years); }
function pvGrowingAnnuity(P1,r,g,n){
  if(n<=0) return 0;
  if(Math.abs(r-g)<1e-9) return P1*n/(1+r);
  return P1/(r-g)*(1-Math.pow((1+g)/(1+r),n));
}
function pvAnnuity(A,r,n){
  if(n<=0) return 0;
  if(r===0) return A*n;
  return A*(1-Math.pow(1+r,-n))/r;
}
function sipRequired(FVtarget, annualRate, years){
  const i = annualRate/12, n = Math.round(years*12);
  if(n<=0) return FVtarget;
  const factor = ((Math.pow(1+i,n)-1)/i)*(1+i);
  return FVtarget/factor;
}
function buildGlidePath(age, retireAge, rp){
  const yearsLeft = Math.max(retireAge-age,0);
  const bands = [];
  if(yearsLeft > 10){
    bands.push({label:`${age}–${retireAge-10} (now till 10 yrs to retirement)`, equity:rp.equity, debt:rp.debt});
    bands.push({label:`${retireAge-10}–${retireAge-5}`, equity:Math.max(rp.equity-20,10), debt:Math.min(rp.debt+20,90)});
    bands.push({label:`${retireAge-5}–${retireAge} (final stretch)`, equity:Math.max(rp.equity-40,10), debt:Math.min(rp.debt+40,90)});
  } else if(yearsLeft > 5){
    bands.push({label:`${age}–${retireAge-5}`, equity:Math.max(rp.equity-20,10), debt:Math.min(rp.debt+20,90)});
    bands.push({label:`${retireAge-5}–${retireAge} (final stretch)`, equity:Math.max(rp.equity-40,10), debt:Math.min(rp.debt+40,90)});
  } else {
    bands.push({label:`${age}–${retireAge} (final stretch)`, equity:Math.max(rp.equity-40,10), debt:Math.min(rp.debt+40,90)});
  }
  bands.push({label:`${retireAge}+ (in retirement)`, equity:10, debt:90});
  return bands;
}
function blendedRate(){
  const p = RISK_PROFILES[state.risk];
  return (p.equity*EQUITY_RATE + p.debt*DEBT_RATE)/100;
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------------------------------------------------------
   STEP DEFINITIONS
--------------------------------------------------------- */
const steps = ["welcome","personal","family","income","expenses","loans","insurance","assets","risk","goals","retirement","review"];
const stepTitles = {
  welcome:"Welcome", personal:"About You", family:"Your Family", income:"Income",
  expenses:"Monthly Expenses", loans:"Loans & EMIs", insurance:"Insurance & Savings",
  assets:"Property & Assets",
  risk:"Risk Profile", goals:"Your Goals", retirement:"Retirement", review:"Your Plan"
};
let current = 0;

function renderProgress(){
  const track = document.getElementById('progressTrack');
  track.innerHTML = "";
  steps.forEach((s,i)=>{
    const seg = document.createElement('div');
    seg.className = 'progress-seg' + (i<current?' done':(i===current?' current':''));
    track.appendChild(seg);
  });
  document.getElementById('stepLabel').textContent = `Step ${current+1} of ${steps.length} · ${stepTitles[steps[current]]}`;
}

function go(delta){
  current = Math.max(0, Math.min(steps.length-1, current+delta));
  render();
}

function goToHome(){
  current = 0;
  render();
}

/* ---------------------------------------------------------
   RENDER MAIN
--------------------------------------------------------- */
function render(){
  renderProgress();
  const main = document.getElementById('main');
  main.innerHTML = "";
  main.appendChild(renderStep(steps[current]));
  renderNav();
  main.scrollTop = 0;
}

function renderNav(){
  const nav = document.getElementById('navBar');
  nav.innerHTML = "";
  if(current>0){
    const back = document.createElement('button');
    back.className = 'btn ghost'; back.textContent = 'Back';
    back.onclick = ()=>go(-1);
    nav.appendChild(back);
  }
  const next = document.createElement('button');
  next.className = 'btn primary';
  if(steps[current]==='welcome') next.textContent = "Let's begin";
  else if(steps[current]==='review') next.textContent = "Download PDF report";
  else next.textContent = 'Continue';
  next.onclick = ()=>{
    if(steps[current]==='review'){ generatePDF(); return; }
    go(1);
  };
  nav.appendChild(next);
}

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

/* ---------------------------------------------------------
   STEP RENDERERS
--------------------------------------------------------- */
function renderStep(name){
  if(name==='welcome') return stepWelcome();
  if(name==='personal') return stepPersonal();
  if(name==='family') return stepFamily();
  if(name==='income') return stepIncome();
  if(name==='expenses') return stepExpenses();
  if(name==='loans') return stepLoans();
  if(name==='insurance') return stepInsurance();
  if(name==='assets') return stepAssets();
  if(name==='risk') return stepRisk();
  if(name==='goals') return stepGoals();
  if(name==='retirement') return stepRetirement();
  if(name==='review') return stepReview();
}

function stepWelcome(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="welcome-icon">₹</div>
    <h1 class="q">A complete financial plan, built from a short conversation.</h1>
    <p class="hint">Answer a few questions about your income, goals and family — Poorna will work out your emergency fund, insurance gap, goal targets and retirement number, then hand you a personal financial plan as a PDF.</p>
    <p class="hint">Takes about 4 minutes. Nothing is sent anywhere — everything runs on this device.</p>
  `;
  return wrap;
}

function stepPersonal(){
  const p = state.personal;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <h1 class="q">Let's start with you.</h1>
    <p class="hint">This helps us time your goals and your retirement correctly.</p>
    <label class="field-label">Your name</label>
    <input type="text" id="p_name" value="${p.name}" placeholder="e.g. Anjali Menon">
    <div class="row2">
      <div>
        <label class="field-label">Current age</label>
        <input type="number" id="p_age" value="${p.age}">
      </div>
      <div>
        <label class="field-label">Planned retirement age</label>
        <input type="number" id="p_retire" value="${p.retireAge}">
      </div>
    </div>
    <label class="field-label">Occupation</label>
    <input type="text" id="p_occ" value="${p.occupation}" placeholder="e.g. Manager, Research Associate">
    <label class="field-label">Marital status</label>
    <select id="p_marital">
      ${["Single","Married","Widowed","Separated"].map(m=>`<option ${p.marital===m?'selected':''}>${m}</option>`).join('')}
    </select>
    <label class="field-label">Country</label>
    <select id="p_country">
      ${Object.keys(COUNTRY_INFLATION).map(c=>`<option ${p.country===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <p class="hint" style="margin-top:8px;">We use this to pick realistic inflation rates for your goals and retirement automatically — no need to set them yourself.</p>
  `;
  wrap.querySelector('#p_name').oninput = e=>p.name=e.target.value;
  wrap.querySelector('#p_age').oninput = e=>p.age=+e.target.value||0;
  wrap.querySelector('#p_retire').oninput = e=>p.retireAge=+e.target.value||0;
  wrap.querySelector('#p_occ').oninput = e=>p.occupation=e.target.value;
  wrap.querySelector('#p_marital').onchange = e=>p.marital=e.target.value;
  wrap.querySelector('#p_country').onchange = e=>p.country=e.target.value;
  return wrap;
}

function stepFamily(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `<h1 class="q">Who else is in your household?</h1><p class="hint">Add your spouse, children or dependents. This sets your health cover requirement and insurance goals.</p>`;
  const list = document.createElement('div'); list.className='card-list';
  state.family.forEach((m,i)=>{
    const row = el(`
      <div class="item-card">
        <button class="rm">Remove</button>
        <label class="field-label" style="margin-top:0">Name</label>
        <input type="text" value="${m.name}" data-f="name">
        <div class="row2">
          <div><label class="field-label">Relation</label>
            <select data-f="relation">
              ${["Spouse","Daughter","Son","Father","Mother","Other"].map(r=>`<option ${m.relation===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          <div><label class="field-label">Age</label>
            <input type="number" value="${m.age}" data-f="age">
          </div>
        </div>
      </div>`);
    row.querySelector('.rm').onclick=()=>{ state.family.splice(i,1); render(); };
    row.querySelectorAll('[data-f]').forEach(inp=>{
      inp.oninput = inp.onchange = ()=>{ m[inp.dataset.f]= inp.type==='number'?+inp.value||0:inp.value; };
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  const addBtn = el(`<button class="add-btn">+ Add family member</button>`);
  addBtn.onclick = ()=>{ state.family.push({name:"",relation:"Daughter",age:0}); render(); };
  wrap.appendChild(addBtn);
  return wrap;
}

function stepIncome(){
  const i = state.income;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <h1 class="q">What comes in each month?</h1>
    <p class="hint">Use take-home / gross monthly figures, whichever you track.</p>
    <label class="field-label">Monthly salary or business income</label>
    <div class="rupee-wrap"><input type="number" id="i_sal" value="${i.salary}"></div>
    <label class="field-label">Other monthly income (rent, freelance, etc.)</label>
    <div class="rupee-wrap"><input type="number" id="i_other" value="${i.other}"></div>
  `;
  wrap.querySelector('#i_sal').oninput = e=>i.salary=+e.target.value||0;
  wrap.querySelector('#i_other').oninput = e=>i.other=+e.target.value||0;
  return wrap;
}

function getPreviousMonthTarget(){
  const now = new Date();
  let targetMonth = now.getMonth(); // 0-indexed (0 = Jan, 7 = Aug)
  let targetYear = now.getFullYear();
  if(targetMonth === 0){
    targetMonth = 12;
    targetYear -= 1;
  }
  const monthNames = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  return {
    monthNum: targetMonth, // 1 to 12
    monthStr: String(targetMonth).padStart(2,'0'),
    monthName: monthNames[targetMonth - 1],
    year: targetYear,
    yearShort: String(targetYear).slice(-2)
  };
}

function parseExpensesFromSMS(text){
  const CATS = {
    household:["swiggy","zomato","grocery","supermarket","bigbasket","d-mart","dmart","more retail","reliance fresh","milk","kirana"],
    transport:["fuel","petrol","diesel","uber","ola","rapido","fastag","irctc","metro card","parking"],
    discretionary:["amazon","flipkart","myntra","ajio","mall","shopping","nykaa","zara","h&m"],
    healthcare:["hospital","pharmacy","clinic","medplus","apollo","diagnostic","chemist"],
    education:["school","tuition","college","university","fee payment","coaching"]
  };
  const sums = {household:0,transport:0,discretionary:0,healthcare:0,education:0,other:0};
  const debitWords = /debited|spent|paid|withdrawn|purchase|txn of|has been used/i;
  const creditWords = /credited|received|refund|reversed|cashback/i;
  const amountRe = /(?:rs\.?|inr)\s*([\d,]+(?:\.\d{1,2})?)/i;
  
  const target = getPreviousMonthTarget();
  let matched = 0;

  text.split(/\r?\n+/).forEach(line=>{
    if(!line.trim()) return;
    if(creditWords.test(line) && !debitWords.test(line)) return;
    if(!debitWords.test(line)) return;

    // Strict prior-month date check (e.g. DD-08-26, DD/08/2026, or "DD Aug")
    const dateRe = new RegExp(`(?:\\b\\d{1,2}[-\\/]${target.monthStr}[-\\/](?:${target.year}|${target.yearShort})\\b)|(?:\\b\\d{1,2}\\s+${target.monthName}\\b)`,'i');
    if(!dateRe.test(line)) return;

    const am = line.match(amountRe);
    if(!am) return;
    const amount = parseFloat(am[1].replace(/,/g,''));
    if(!amount) return;
    const lower = line.toLowerCase();
    let cat = 'other';
    for(const [c,keys] of Object.entries(CATS)){
      if(keys.some(k=>lower.includes(k))){ cat=c; break; }
    }
    sums[cat]+=amount;
    matched++;
  });
  return {sums, matched, target};
}

function requestSmsAccess(){
  if(window.AndroidBridge && typeof window.AndroidBridge.getBankSMS === 'function'){
    try{
      const raw = window.AndroidBridge.getBankSMS();
      return { supported:true, messages: JSON.parse(raw) };
    }catch(err){
      return { supported:true, messages:[], error:String(err) };
    }
  }
  return { supported:false, messages:[] };
}

function generateDemoSMS(count=24){
  const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a));
  const day=()=>1+Math.floor(Math.random()*28);
  const target = getPreviousMonthTarget();
  const dateStr = `${day().toString().padStart(2,'0')}-${target.monthStr}-${target.yearShort}`;
  const templates = [
    ()=>`Rs.${rnd(100,600)}.00 debited from A/c XX1234 for UPI txn to SWIGGY on ${dateStr}`,
    ()=>`Rs.${rnd(200,1500)} spent on HDFC Bank Card at AMAZON on ${dateStr}`,
    ()=>`Rs.${rnd(300,900)} debited for FASTAG recharge on ${dateStr}`,
    ()=>`Rs.${rnd(400,2500)} debited for UPI txn to BIGBASKET on ${dateStr}`,
    ()=>`Rs.${rnd(150,700)} debited towards fuel at INDIAN OIL PETROL PUMP on ${dateStr}`,
    ()=>`Rs.${rnd(500,3000)} debited for purchase at MYNTRA on ${dateStr}`,
    ()=>`Rs.${rnd(300,2000)} debited for payment to APOLLO PHARMACY on ${dateStr}`,
    ()=>`Rs.${rnd(1000,5000)} debited for SCHOOL FEE PAYMENT on ${dateStr}`
  ];
  const out=[];
  for(let i=0;i<count;i++) out.push(templates[i%templates.length]());
  return out;
}

function applyParsedMessages(messages, resultEl, wrap, e, label){
  const clean = messages.filter(m=>m && m.trim());
  const {sums, matched, target} = parseExpensesFromSMS(clean.join('\n'));
  const monthLabel = target.monthName.toUpperCase() + ' ' + target.year;
  if(matched===0){
    resultEl.textContent = `Couldn't find any debit messages for previous month (${monthLabel}).`;
    return;
  }
  Object.keys(sums).forEach(k=>{
    e[k] = Math.round((e[k]||0) + sums[k]);
    const input = wrap.querySelector(`#e_${k}`);
    if(input) input.value = e[k];
  });
  resultEl.innerHTML = `<b>${label?label+' ':''} (${monthLabel}):</b> Processed ${matched} transaction${matched>1?'s':''} from previous month into the categories above.`;
}

/* ---------------------------------------------------------
   CALCULATION ENGINE
--------------------------------------------------------- */
function computePlan(){
  const p = state.personal;
  const totalIncome = state.income.salary + state.income.other;
  const totalExpenses = Object.values(state.expenses).reduce((a,b)=>a+b,0);
  const totalEMI = state.loans.reduce((a,l)=>a+l.emi,0);
  const totalLiabilities = state.loans.reduce((a,l)=>a+l.outstanding,0);
  const totalPremiums = state.premiums.lifePremium + state.premiums.healthPremium;
  const totalInvestAssets = state.investments.reduce((a,i)=>a+i.amount,0);
  const totalPhysicalAssets = state.physicalAssets.home + state.physicalAssets.gold + state.physicalAssets.other;
  const totalAssets = totalInvestAssets + totalPhysicalAssets;
  const totalOutflow = totalExpenses + totalEMI + totalPremiums + state.existingSIP;
  const monthlySurplus = totalIncome - totalOutflow;

  const netWorth = totalAssets - totalLiabilities;

  const monthlyCommitted = totalExpenses + totalEMI + totalPremiums;
  const emergencyFund = 6 * monthlyCommitted;

  const rate = blendedRate();
  const goals = state.goals.map(g=>{
    const infl = goalInflationRate(g.name);
    const years = Math.max(g.years,0.1);
    const corpus = fv(g.cost, infl, years);
    const useRate = years < 3 ? DEBT_RATE : rate;
    const sip = sipRequired(corpus, useRate, years);
    return {...g, corpus, sip, years};
  });

  const coverageHorizon = Math.max((state.retirement.lifeExpectancy||85) - p.age, 1);
  const annualLivingExp = totalExpenses*12;
  const hlvCoverage = pvGrowingAnnuity(annualLivingExp, DEBT_RATE, countryRates().general, coverageHorizon);
  const familyProtectGoalsList = goals.filter(g=>/education|wedding|marriage/i.test(g.name));
  const familyProtectGoals = familyProtectGoalsList.reduce((a,g)=>a+g.corpus,0);
  const totalCoverageRequired = hlvCoverage + totalLiabilities + familyProtectGoals;
  const additionalLifeCoverNeeded = Math.max(0, totalCoverageRequired - state.insurance.lifeCover - totalInvestAssets);

  const familySize = state.family.length + 1;
  const recommendedHealth = Math.max(2000000, 500000*familySize);
  const healthGap = Math.max(0, recommendedHealth - state.insurance.healthCover);

  const yearsToRetire = Math.max(p.retireAge - p.age, 0);
  const postRetireYears = Math.max((state.retirement.lifeExpectancy||85) - p.retireAge, 1);
  const annualExpenseToday = state.retirement.expenseToday*12;
  const actualAnnualAtRetirement = fv(annualExpenseToday, countryRates().general, yearsToRetire);
  const corpusGross = pvGrowingAnnuity(actualAnnualAtRetirement, DEBT_RATE, countryRates().general, postRetireYears);
  const otherIncomeAnnual = state.retirement.otherIncome*12;
  const pvOtherIncome = pvAnnuity(otherIncomeAnnual, DEBT_RATE, postRetireYears);
  const retirementCorpus = Math.max(0, corpusGross - pvOtherIncome);
  const retirementSIP = sipRequired(retirementCorpus, rate, yearsToRetire);

  const availableForGoals = Math.max(0, monthlySurplus - retirementSIP);
  function recomputeGoal(g){
    const infl = goalInflationRate(g.name);
    g.corpus = fv(g.cost, infl, g.years);
    const useRate = g.years < 3 ? DEBT_RATE : rate;
    g.sip = sipRequired(g.corpus, useRate, g.years);
  }
  goals.forEach(g=>{ g.delay = 0; g.originalYears = g.years; });
  let guard = 0;
  while(goals.reduce((a,g)=>a+g.sip,0) > availableForGoals && guard < 300){
    guard++;
    const flexible = goals.filter(g=>g.delay < 5);
    if(!flexible.length) break;
    flexible.sort((a,b)=>b.years-a.years);
    const target = flexible[0];
    target.years += 1;
    target.delay += 1;
    recomputeGoal(target);
  }
  const totalGoalCorpus = goals.reduce((a,g)=>a+g.corpus,0);
  const totalGoalSIP = goals.reduce((a,g)=>a+g.sip,0);
  const goalShortfall = Math.max(0, totalGoalSIP - availableForGoals);
  const rescheduledGoals = goals.filter(g=>g.delay>0);

  const contingencyRatio = monthlyCommitted>0 ? totalInvestAssets/monthlyCommitted : 0;
  const totalAssetsForRatio = totalAssets;
  const debtAssetRatio = totalAssetsForRatio>0 ? (totalLiabilities/totalAssetsForRatio)*100 : (totalLiabilities>0?100:0);
  const savingsRatio = totalIncome>0 ? (monthlySurplus/totalIncome)*100 : 0;
  const debtServiceRatio = totalIncome>0 ? (totalEMI/totalIncome)*100 : 0;

  function zone(value, greenTest, yellowTest){
    if(greenTest(value)) return 'green';
    if(yellowTest(value)) return 'yellow';
    return 'red';
  }
  const ratios = {
    contingency:{ value:contingencyRatio, zone: zone(contingencyRatio, v=>v>=4, v=>v>=2), fmt:contingencyRatio.toFixed(1)+"x" },
    debtAsset:{ value:debtAssetRatio, zone: zone(debtAssetRatio, v=>v<40, v=>v<50), fmt:debtAssetRatio.toFixed(0)+"%" },
    savings:{ value:savingsRatio, zone: zone(savingsRatio, v=>v>=25, v=>v>=15), fmt:savingsRatio.toFixed(0)+"%" },
    debtService:{ value:debtServiceRatio, zone: zone(debtServiceRatio, v=>v<=30, v=>v<=40), fmt:debtServiceRatio.toFixed(0)+"%" }
  };

  return {
    totalIncome, totalExpenses, totalEMI, totalLiabilities, totalPremiums, totalInvestAssets,
    totalPhysicalAssets, totalAssets,
    monthlySurplus, netWorth, emergencyFund, goals, totalGoalCorpus, totalGoalSIP,
    additionalLifeCoverNeeded, totalCoverageRequired, recommendedHealth, healthGap, familySize,
    yearsToRetire, postRetireYears, retirementCorpus, retirementSIP, ratios, rate,
    rescheduledGoals, goalShortfall,
    hlvCoverage, coverageHorizon, annualLivingExp, familyProtectGoals, familyProtectGoalsList
  };
}

      <div style="font-weight:700;color:#12312B;font-size:15px;margin-bottom:4px;">🎉 PDF Report Generated Successfully!</div>
      <p style="font-size:12.5px;color:#2C7A55;margin:0 0 12px;">Your plan file has been saved locally to your device downloads.</p>
      <button id="pdfHomeBtn" class="add-btn" style="background:#12312B;color:#fff;border:none;margin-top:0;">🏠 Return to Home</button>
    </div>

    <div class="summary-card">
      <div class="label">Net worth</div>
      <div class="value">${inr(c.netWorth)}</div>
      <div class="sub">Financial + physical assets minus outstanding loans</div>
    </div>

    <div class="grid2">
      <div class="mini"><div class="label">Monthly surplus</div><div class="value">${inr(c.monthlySurplus)}</div></div>
      <div class="mini"><div class="label">Emergency fund needed</div><div class="value">${inr(c.emergencyFund)}</div></div>
      <div class="mini"><div class="label">Additional life cover</div><div class="value">${inr(c.additionalLifeCoverNeeded)}</div></div>
      <div class="mini"><div class="label">Health cover gap</div><div class="value">${inr(c.healthGap)}</div></div>
    </div>

    <h2 class="section-title">Goal dashboard</h2>
    <div class="mini" style="padding:14px;">
      ${c.goals.length? c.goals.map(g=>`
        <div class="goal-row">
          <div><div class="n">${g.name||'Unnamed goal'}</div><div class="c">${g.years} yrs · ${GOAL_CATEGORY_LABELS[detectGoalCategory(g.name)]} infl.${g.delay?` <span style="color:var(--amber);font-weight:700;">· pushed out ${g.delay} yr${g.delay>1?'s':''}</span>`:''} · SIP ${inr(g.sip)}/mo</div></div>
          <div>${inr(g.corpus)}</div>
        </div>`).join('') : '<span class="hint" style="margin:0">No goals added yet.</span>'}
    </div>

    <h2 class="section-title">Retirement</h2>
    <div class="grid2">
      <div class="mini"><div class="label">Years to retire</div><div class="value">${c.yearsToRetire}</div></div>
      <div class="mini"><div class="label">Corpus required</div><div class="value">${inr(c.retirementCorpus)}</div></div>
      <div class="mini" style="grid-column:span 2;"><div class="label">Suggested monthly SIP for retirement</div><div class="value">${inr(c.retirementSIP)}</div></div>
    </div>

    <h2 class="section-title">Financial health check</h2>
    <div class="grid2">
      ${ratioMini("Contingency cover", c.ratios.contingency.fmt, c.ratios.contingency.zone)}
      ${ratioMini("Debt to assets", c.ratios.debtAsset.fmt, c.ratios.debtAsset.zone)}
      ${ratioMini("Savings ratio", c.ratios.savings.fmt, c.ratios.savings.zone)}
      ${ratioMini("Debt service ratio", c.ratios.debtService.fmt, c.ratios.debtService.zone)}
    </div>
  `;

  const homeBtn = wrap.querySelector('#pdfHomeBtn');
  if(homeBtn){
    homeBtn.onclick = ()=>goToHome();
  }

  return wrap;
}
function ratioMini(label,val,zone){
  return `<div class="mini"><div class="label">${label}</div><div class="value">${val}</div><span class="zone ${zone}">${zone==='green'?'Good':zone==='yellow'?'Watch':'Act now'}</span></div>`;
}

/* ---------------------------------------------------------
   PDF GENERATION
--------------------------------------------------------- */
function loadJsPDF(){
  return new Promise((resolve, reject)=>{
    if(window.jspdf && window.jspdf.jsPDF){ resolve(); return; }
    const existing = document.getElementById('jspdf-script');
    const onOk = ()=>{
      if(window.jspdf && window.jspdf.jsPDF) resolve();
      else reject(new Error("PDF library loaded but didn't initialise as expected."));
    };
    const onFail = ()=>reject(new Error("Couldn't load the PDF library — check your internet connection and try again."));
    if(existing){
      existing.addEventListener('load', onOk, {once:true});
      existing.addEventListener('error', onFail, {once:true});
      setTimeout(()=>{ if(window.jspdf && window.jspdf.jsPDF) resolve(); }, 50);
      return;
    }
    const s = document.createElement('script');
    s.id = 'jspdf-script';
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = onOk;
    s.onerror = onFail;
    document.head.appendChild(s);
  });
}

async function generatePDF(){
  const btn = document.querySelector('#navBar .btn.primary');
  const originalLabel = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing your PDF…'; }
    await loadJsPDF();
    buildAndSavePDF();
    
    const successBox = document.getElementById('downloadSuccessBox');
    if(successBox) successBox.style.display = 'block';

  }catch(err){
    console.error(err);
    alert("Couldn't generate the PDF.\n\n" + (err && err.message ? err.message : "Please check your internet connection and try again."));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = originalLabel || "Download PDF report"; }
  }
}

function buildAndSavePDF(){
  const c = computePlan();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 48;
  let y = 0;
  const primary = [18,49,43];
  const accent = [201,154,62];

  function newPage(){
    doc.addPage();
    y = margin;
    footer();
  }
  function footer(){
    const h = doc.internal.pageSize.getHeight();
    doc.setFontSize(8); doc.setTextColor(150);
    doc.text("Poorna Financial Plan · Private & Confidential", margin, h-24);
    doc.text(new Date().toLocaleDateString('en-IN'), pageW-margin, h-24, {align:'right'});
  }
  function ensureSpace(h){
    const pageH = doc.internal.pageSize.getHeight();
    if(y + h > pageH - 50){ newPage(); }
  }
  function heading(text){
    ensureSpace(40);
    doc.setFillColor(...primary);
    doc.rect(margin, y, pageW-margin*2, 24, 'F');
    doc.setTextColor(255,255,255); doc.setFont(undefined,'bold'); doc.setFontSize(11);
    doc.text(text, margin+10, y+16);
    y += 24+14;
    doc.setTextColor(0,0,0); doc.setFont(undefined,'normal');
  }
  function para(text, size=10){
    doc.setFontSize(size); doc.setTextColor(40,40,40);
    const lines = doc.splitTextToSize(text, pageW-margin*2);
    ensureSpace(lines.length*14+6);
    doc.text(lines, margin, y);
    y += lines.length*14+8;
  }
  function table(rows, colWidths){
    const rowH = 20;
    ensureSpace(rowH*(rows.length+1));
    let x = margin;
    doc.setFontSize(9);
    rows.forEach((row,ri)=>{
      x = margin;
      if(ri===0){ doc.setFillColor(...primary); doc.setTextColor(255,255,255); doc.setFont(undefined,'bold'); }
      else { doc.setFillColor(ri%2===0?248:255,ri%2===0?250:255,ri%2===0?247:255); doc.setTextColor(30,30,30); doc.setFont(undefined,'normal'); }
      doc.rect(margin, y, colWidths.reduce((a,b)=>a+b,0), rowH, 'F');
      row.forEach((cell,ci)=>{
        doc.text(String(cell), x+6, y+13, {maxWidth:colWidths[ci]-10});
        x += colWidths[ci];
      });
      y += rowH;
    });
    y += 10;
    doc.setTextColor(0,0,0);
  }
  function kv(label, value){
    ensureSpace(18);
    doc.setFontSize(10); doc.setTextColor(90,90,90);
    doc.text(label, margin, y);
    doc.setTextColor(20,20,20); doc.setFont(undefined,'bold');
    doc.text(String(value), pageW-margin, y, {align:'right'});
    doc.setFont(undefined,'normal');
    y += 16;
  }

  // COVER PAGE
  doc.setFillColor(...primary);
  doc.rect(0,0,pageW, doc.internal.pageSize.getHeight(), 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(12); doc.text("POORNA", margin, 90);
  doc.setFontSize(28); doc.setFont(undefined,'bold');
  doc.text("Personal Financial Plan", margin, 130, {maxWidth:pageW-margin*2});
  doc.setFont(undefined,'normal'); doc.setFontSize(11);
  doc.setDrawColor(...accent); doc.setLineWidth(3);
  doc.line(margin,150,margin+120,150);
  doc.setFontSize(12);
  doc.text(`Prepared for: ${state.personal.name||'—'}`, margin, 220);
  doc.text(`Date: ${new Date().toLocaleDateString('en-IN')}`, margin, 242);
  doc.addPage();
  y = margin;

  // EXECUTIVE SUMMARY
  heading("EXECUTIVE SUMMARY");
  para(`This plan looks at ${state.personal.name||'your'} income, expenses, existing savings, insurance and life goals.`);
  kv("Monthly income", inr(c.totalIncome));
  kv("Monthly investable surplus", inr(c.monthlySurplus));
  kv("Net worth today", inr(c.netWorth));
  y += 6;

  // RETIREMENT
  heading("RETIREMENT PLAN");
  kv("Retirement corpus required", inr(c.retirementCorpus));
  kv("Suggested monthly SIP for retirement", inr(c.retirementSIP));

  footer();
  doc.save(`${(state.personal.name||'Financial-Plan').replace(/\s+/g,'_')}_Poorna_Plan.pdf`);
}

--------------------------------------------------------- */
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
